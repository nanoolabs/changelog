name: Optimize Brand Logos

on:
  push:
    paths:
      - "brands/**/*.svg"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Optimize SVGs
        run: |
          find brands -name "*.svg" -not -path "brands/v.0.0.1/*" -exec bunx svgo {} --config svgo.config.js \;

      - name: Commit and push optimized SVGs
        run: |
          git config user.name "nanoobot"
          git config user.email "bot@nanoolabs.dev"
          git add brands/
          git diff --staged --quiet || git commit -m "chore: optimize brand logos [bunx] [automated]"
          git push

      - name: Install Rclone (Official Latest Stable)
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Update brands/latest/
        run: bash scripts/update-latest.sh

      - name: Deploy brands to B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: bash scripts/sync-b2.sh confirm
